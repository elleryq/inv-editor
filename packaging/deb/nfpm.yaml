# nfpm config for the Debian package. See docs/packaging.md.
# Run through packaging/deb/build.sh, which stages files under build/deb/
# and sets:
#   DEB_ARCH     Debian architecture (amd64, arm64)
#   DEB_VERSION  Package version without a leading "v" (e.g. 1.4.0, 1.4.0-rc1)
# Paths are relative to the repository root.
name: inv-editor
arch: ${DEB_ARCH}
platform: linux
version: ${DEB_VERSION}
version_schema: semver
section: admin
priority: optional
maintainer: "Ellery Tsai <22297+elleryq@users.noreply.github.com>"
description: |
  Interactive editor for Ansible inventory files
  Provides a keyboard-driven terminal UI and an optional web interface
  for managing groups, hosts and variables in INI or YAML inventories.
homepage: https://github.com/elleryq/inv-editor
license: MIT
suggests:
  - ansible
contents:
  - src: ./build/deb/inv-editor
    dst: /usr/bin/inv-editor
    file_info:
      mode: 0755
  - src: ./LICENSE
    dst: /usr/share/doc/inv-editor/copyright
    file_info:
      mode: 0644
  - src: ./build/deb/changelog.gz
    dst: /usr/share/doc/inv-editor/changelog.gz
    file_info:
      mode: 0644
  - src: ./README.md
    dst: /usr/share/doc/inv-editor/README.md
    file_info:
      mode: 0644
  - src: ./packaging/deb/lintian-overrides
    dst: /usr/share/lintian/overrides/inv-editor
    file_info:
      mode: 0644
