# nfpm config for the Debian and RPM packages. See docs/packaging.md.
# Run through packaging/build.sh, which stages files under build/pkg/
# and sets:
#   PKG_ARCH     GOARCH-style architecture (amd64, arm64); nfpm maps it to
#                x86_64 / aarch64 for RPM
#   PKG_VERSION  Package version without a leading "v" (e.g. 1.4.0, 1.4.0-rc1)
# Paths are relative to the repository root.
name: inv-editor
arch: ${PKG_ARCH}
platform: linux
version: ${PKG_VERSION}
version_schema: semver
section: admin
priority: optional
maintainer: "Ellery Tsai <22297+elleryq@users.noreply.github.com>"
description: |
  Interactive editor for Ansible inventory files
  Provides a keyboard-driven terminal UI and an optional web interface
  for managing groups, hosts and variables in INI or YAML inventories.
homepage: https://github.com/elleryq/inv-editor
license: MIT
suggests:
  - ansible
rpm:
  summary: Interactive editor for Ansible inventory files
contents:
  - src: ./build/pkg/inv-editor
    dst: /usr/bin/inv-editor
    file_info:
      mode: 0755
  # Debian: everything under /usr/share/doc is documentation by convention,
  # and the license goes to the policy-mandated copyright file.
  - src: ./README.md
    dst: /usr/share/doc/inv-editor/README.md
    packager: deb
    file_info:
      mode: 0644
  - src: ./LICENSE
    dst: /usr/share/doc/inv-editor/copyright
    packager: deb
    file_info:
      mode: 0644
  - src: ./build/pkg/changelog.gz
    dst: /usr/share/doc/inv-editor/changelog.gz
    packager: deb
    file_info:
      mode: 0644
  - src: ./packaging/deb/lintian-overrides
    dst: /usr/share/lintian/overrides/inv-editor
    packager: deb
    file_info:
      mode: 0644

  # RPM: README is marked %doc and LICENSE %license, so rpm's
  # --excludedocs and license handling work as expected.
  - src: ./README.md
    dst: /usr/share/doc/inv-editor/README.md
    packager: rpm
    type: doc
    file_info:
      mode: 0644
  - src: ./LICENSE
    dst: /usr/share/licenses/inv-editor/LICENSE
    packager: rpm
    type: license
    file_info:
      mode: 0644
