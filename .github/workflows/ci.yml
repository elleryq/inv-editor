name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: |
          go mod verify
          go mod tidy -diff

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

  packages:
    name: Linux packages (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rpm_arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            rpm_arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      TAG: v0.0.0-ci
      PKG_ARCH: ${{ matrix.arch }}
      RPM_ARCH: ${{ matrix.rpm_arch }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-s -w -X main.version=${TAG}" \
            -o build/inv-editor ./cmd/inv-editor

      - name: Install nfpm
        run: |
          packaging/install-nfpm.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build .deb and .rpm
        run: packaging/build.sh build/inv-editor "$TAG" "$PKG_ARCH" build/out deb rpm

      - name: Inspect .deb
        run: |
          deb="build/out/inv-editor_0.0.0~ci_${PKG_ARCH}.deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          test "$(dpkg-deb --field "$deb" Architecture)" = "$PKG_ARCH"
          test "$(dpkg-deb --field "$deb" Version)" = "0.0.0~ci"

      - name: Lintian
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lintian
          lintian --fail-on error build/out/*.deb

      - name: Install, run and remove .deb
        run: |
          sudo apt-get install -y "./build/out/inv-editor_0.0.0~ci_${PKG_ARCH}.deb"
          test "$(inv-editor --version)" = "inv-editor 0.0.0-ci"
          inv-editor --help > /dev/null
          sudo apt-get remove -y inv-editor
          test ! -e /usr/bin/inv-editor

      # Fedora: inspect, rpmlint, install. AlmaLinux 9 (RHEL-compatible): install.
      - name: Check .rpm on Fedora
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src fedora:latest \
            packaging/rpm/check.sh "build/out/inv-editor-0.0.0~ci-1.${RPM_ARCH}.rpm" \
            "$RPM_ARCH" 0.0.0~ci 0.0.0-ci lint

      - name: Check .rpm on AlmaLinux 9
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src almalinux:9 \
            packaging/rpm/check.sh "build/out/inv-editor-0.0.0~ci-1.${RPM_ARCH}.rpm" \
            "$RPM_ARCH" 0.0.0~ci 0.0.0-ci
